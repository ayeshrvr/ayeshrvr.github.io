<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A3263">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bot Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- Header -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo left"><img src="/img/logo.png" alt="logo"></a>

            <!-- Notification Icon -->
            <div class="right valign-wrapper" style="height: 100%;">
                <a href="/pages/notifications.html">
                    <div class="notification-wrapper" style="position: relative; margin-right: 20px; cursor: pointer;">
                        <i class="material-icons grey-text text-darken-1">notifications_none</i>
                        <span id="notification-badge" class="notif-badge"></span>
                    </div>
                </a>

                <span class="right grey-text text-darken-1">
                    <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
                </span>
            </div> 
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <div class="container">
        <div class="row" style="margin-top: 20px;">
            <div class="col s12 m8 offset-m2">
                <div class="card-panel white z-depth-1 center-align" style="border-radius: 12px; padding: 15px;">
                    <div id="status-container" class="valign-wrapper justify-center" style="display: inline-flex;">
                        <div class="left">
                            <span id="bot-dot" class="btn-floating btn-small waves-effect waves-light green pulse" style="width: 12px; height: 12px; margin-right: 10px;"></span>
                            <span class="fw-bold" style="font-weight: 700; letter-spacing: 1px; color: #222;">BOT RUNNING</span>
                        </div>
                        <span class="mx-3 grey-text" style="font-size: 0.8rem; margin: 0 15px;"> | </span>
                        <div class="right">
                            <span class="fw-bold" style="font-weight: 700; letter-spacing: 1px; color: #222;">TRADING OFF</span>
                            <span id="trading-dot" class="btn-floating btn-small waves-effect waves-light orange pulse" style="width: 12px; height: 12px; margin-left: 10px;"></span>
                        </div>
                    </div>
                    <div class="grey-text" style="font-size: 0.8rem; margin-top: 5px;">Updated: Just now</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <div class="card balance-card center-align">
                    <div class="card-content">
                        <span class="stat-label white-text opacity-7">Current Balance</span>
                        <h2 class="mt-0 mb-5">$1,245.50</h2>
                        <div class="green-text text-accent-3 strong" style="font-size: 1.1rem;">
                            +$24.15 (1.98%) <small class="white-text">Today</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s4">
                <div class="card white card-soft center-align" style="padding: 10px;">
                    <p class="stat-label">Active Grids</p>
                    <p class="stat-value">3</p>
                </div>
            </div>
            <div class="col s4">
                <div class="card white card-soft center-align" style="padding: 10px;">
                    <p class="stat-label">Win Rate</p>
                    <p class="stat-value">92%</p>
                </div>
            </div>
            <div class="col s4">
                <div class="card white card-soft center-align" style="padding: 10px;">
                    <p class="stat-label">Total Fills</p>
                    <p class="stat-value">142</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <div class="card card-soft">
                    <div class="card-content">
                        <span class="card-title grey-text text-darken-2" style="font-size: 0.9rem; font-weight: 800;">ACTIVE GRIDS</span>
                        
                        <div id="active-grids-list">
                            <div class="progress"><div class="indeterminate"></div></div>
                        </div>

                    </div>
                    <div class="card-action center-align" style="border-top: 1px solid #f0f0f0;">
                        <a href="/pages/grid-status.html" class="blue-text text-darken-2 strong">VIEW GRID DETAILS</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="/js/dbConnect.js"></script>
    <script type="text/javascript" src="/js/activeGrids.js"></script>
    <script type="text/javascript" src="/js/notifications.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
</body>

</html>
