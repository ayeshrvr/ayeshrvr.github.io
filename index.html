<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Booking Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- top nav -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="/">Booking<span style="font-size: 20px;"> Manager</span></a>
            <span class="right grey-text text-darken-1">
                <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
            </span>
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <div class="card-panel white blocks" style="padding: 10px 15px;">
        <div class="dashboard-container">
            <div class="header-status card shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="status-indicator" id="status-dot"></span>
                        <span class="fw-bold text-uppercase" id="bot-status">BOT RUNNING</span>
                    </div>
                    <small class="text-muted" id="last-update">Updated: Just now</small>
                </div>
            </div>

            <div class="balance-card card text-center p-4 my-3 bg-dark text-white shadow">
                <h6 class="text-uppercase text-secondary">Current Balance</h6>
                <h2 class="display-5 fw-bold" id="current-balance">$0.00</h2>
                <div class="pnl-chip mt-2" id="today-pnl">
                    +$0.00 (0.00%)
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <div class="card p-3 shadow-sm h-100">
                        <small class="text-muted text-uppercase d-block">Win Rate</small>
                        <span class="fs-4 fw-bold" id="win-rate">0%</span>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card p-3 shadow-sm h-100">
                        <small class="text-muted text-uppercase d-block">Open Positions</small>
                        <span class="fs-4 fw-bold" id="open-positions">0</span>
                    </div>
                </div>
            </div>

            <div class="action-bar card p-3 shadow-lg sticky-bottom">
                <div class="d-flex gap-2">
                    <button class="btn btn-success flex-grow-1 py-3" id="btn-start">START</button>
                    <button class="btn btn-warning flex-grow-1 py-3" id="btn-pause">PAUSE</button>
                    <button class="btn btn-danger flex-grow-1 py-3" id="btn-stop">STOP</button>
                </div>
            </div>
        </div>
    </div>

            <img src="/img/dish.png" alt="recipe thumb">
            <div class="recipe-details">

        </a>
    </div> -->

    <!-- add recipe side nav -->
    <div id="side-form" class="sidenav side-form">
        <form class="add-recipe container section">
            <h6>New Recipe</h6>
            <div class="divider"></div>
            <div class="input-field">
                <input placeholder="e.g. Ninja soup" id="title" type="text" class="validate">
                <label for="title">Recipe Title</label>
            </div>
            <div class="input-field">
                <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
                <label for="ingredients">Ingredients</label>
            </div>
            <div class="input-field center">
                <button class="btn-small">Add</button>
            </div>
        </form>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script type="text/javascript" src="/js/dbConnect.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/charts.js"></script>
</body>

</html>
