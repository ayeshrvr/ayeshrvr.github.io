<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Booking Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- top nav -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="#!" class="brand-logo left">
                <img src="/img/logo.png" alt="logo" class="responsive-img-logo" style="max-height: 45px;">
            </a>
            <span class="right grey-text text-darken-1">
                <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
            </span>
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <!-- page content -->
    <div class="container">
        <div class="row" style="margin-top: 20px;">
            <div class="col s12 m8 offset-m2">
                <div class="card-panel white z-depth-1 center-align" style="border-radius: 12px; padding: 15px;">
                    <div id="status-container" class="valign-wrapper justify-center" style="display: inline-flex;">
                        <span id="status-dot" class="btn-floating btn-small waves-effect waves-light green pulse" style="width: 12px; height: 12px; margin-right: 10px;"></span>
                        <span class="fw-bold" id="bot-status" style="font-weight: 700; letter-spacing: 1px;">BOT RUNNING</span>
                    </div>
                    <div class="grey-text" style="font-size: 0.8rem; margin-top: 5px;" id="last-update">Updated: Just now</div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card blue-grey darken-4 white-text center-align" style="border-radius: 20px;">
                    <div class="card-content">
                        <span class="card-title grey-text text-lighten-1" style="font-size: 0.9rem; text-transform: uppercase;">Current Balance</span>
                        <h2 style="margin: 10px 0; font-weight: 700;" id="current-balance">$0.00</h2>
                        <div id="today-pnl" class="green-text text-accent-3" style="font-weight: 600; font-size: 1.2rem;">
                            +$0.00 (0.00%)
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s6 m4 offset-m2">
                <div class="card white center-align" style="border-radius: 15px;">
                    <div class="card-content" style="padding: 15px;">
                        <p class="grey-text text-darken-1" style="font-size: 0.8rem;">WIN RATE</p>
                        <h5 id="win-rate" style="font-weight: 700; margin: 5px 0;">0%</h5>
                    </div>
                </div>
            </div>
            <div class="col s6 m4">
                <div class="card white center-align" style="border-radius: 15px;">
                    <div class="card-content" style="padding: 15px;">
                        <p class="grey-text text-darken-1" style="font-size: 0.8rem;">POSITIONS</p>
                        <h5 id="open-positions" style="font-weight: 700; margin: 5px 0;">0</h5>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12 m8 offset-m2">
                <div class="card-panel transparent no-shadow center-align">
                    <div class="row">
                        <div class="col s4"><button class="btn-large waves-effect waves-light green full-width" id="btn-start" style="width: 100%; border-radius: 8px;">START</button></div>
                        <div class="col s4"><button class="btn-large waves-effect waves-light orange darken-2 full-width" id="btn-pause" style="width: 100%; border-radius: 8px;">PAUSE</button></div>
                        <div class="col s4"><button class="btn-large waves-effect waves-light red full-width" id="btn-stop" style="width: 100%; border-radius: 8px;">STOP</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <div class="recipes container grey-text text-darken-1">
        <div class="card-panel recipe white row">
            <img src="/img/dish.png" alt="recipe thumb">
            <div class="recipe-details">

            <div class="recipe-delete">
                <i class="material-icons">delete_outline</i>
            </div>

        <a class="btn-floating btn-small add-btn sidenav-trigger" data-target="side-form">
            <i class="material-icons">add</i>
        </a>
    </div> -->

    <!-- add recipe side nav -->
    <div id="side-form" class="sidenav side-form">
        <form class="add-recipe container section">
            <h6>New Recipe</h6>
            <div class="divider"></div>
            <div class="input-field">
                <input placeholder="e.g. Ninja soup" id="title" type="text" class="validate">
                <label for="title">Recipe Title</label>
            </div>
            <div class="input-field">
                <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredients" type="text" class="validate">
                <label for="ingredients">Ingredients</label>
            </div>
            <div class="input-field center">
                <button class="btn-small">Add</button>
            </div>
        </form>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script type="text/javascript" src="/js/dbConnect.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/charts.js"></script>
</body>

</html>
