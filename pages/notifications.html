<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A3263">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bot Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- Header -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="/index.html" class="brand-logo left"><img src="/img/logo.png" alt="logo"></a>

            <!-- Notification Icon -->
            <div class="right valign-wrapper" style="height: 100%;">
                <a href="/pages/notifications.html">
                    <div class="notification-wrapper" style="position: relative; margin-right: 20px; cursor: pointer;">
                        <i class="material-icons grey-text text-darken-1">notifications</i>
                        <span id="notification-badge" class="notif-badge"></span>
                    </div>
                </a>

                <span class="right grey-text text-darken-1">
                    <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
                </span>
            </div> 
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <div class="container section">
        <div class="row">
            <div class="col s12">
                <h5 class="fw-bold blue-grey-text text-darken-4">Alerts</h5>
                <p class="grey-text">Your latest grid activity and system alerts.</p>
            </div>

            <div class="right-align">
                <button onclick="requestNotificationPermission()" class="btn-small blue darken-4 br-10">
                    <i class="material-icons left">notifications_active</i>
                    Enable Mobile Alerts
                </button>
            </div>
        </div>

        <div id="notifications-list" class="row">
            <div class="center-align" style="padding: 40px;">
                <div class="preloader-wrapper small active">
                    <div class="spinner-layer spinner-blue-only">
                        <div class="circle-clipper left"><div class="circle"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="/js/dbConnect.js"></script>
    <script type="text/javascript" src="/js/notifications.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
</body>

</html>
