<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A3263">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bot Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- Header -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="/index.html" class="brand-logo left"><img src="/img/logo.png" alt="logo"></a>
            <span class="right grey-text text-darken-1">
                <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
            </span>
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <div class="container section">
        <div class="card card-soft no-margin-bottom">
            <div class="card-content" style="padding: 15px;">
                <div class="row mb-0 valign-wrapper">
                    <div class="col s6">
                        <span id="coin-symbol" class="fw-bold blue-grey-text text-darken-4" style="font-size: 1.2rem;">---/---</span>
                        <span id="current-price-header" class="blue-text text-darken-4 fw-bold" style="font-size: 1.2rem; margin-left: 8px;">$0.000</span>
                    </div>
                    <div class="col s6 right-align">
                        <span class="stat-label-inline">U: <span id="upper-limit-label" class="grey-text text-darken-4">0.00</span></span>
                        <span class="stat-label-inline" style="margin-left: 10px;">L: <span id="lower-limit-label" class="grey-text text-darken-4">0.00</span></span>
                    </div>
                </div>

                <div class="chart-container" style="position: relative; height: 320px; margin-top: 15px;">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <div class="card card-soft">
                    <div class="card-content">
                        <span class="card-title fw-bold" style="font-size: 1rem;">Performance Insights</span>
                        <div class="row mt-15">
                            <div class="col s4">
                                <span class="stat-label">Volatility</span>
                                <p class="stat-value" id="vol-category">High</p>
                                <span class="stat-label mt-10">Efficiency</span>
                                <p class="stat-value green-text" id="efficiency-percent">0%</p>
                            </div>
                            <div class="col s4">
                                <span class="stat-label">Grid Perf.</span>
                                <p class="stat-value green-text" id="grid-perf">+0.0%</p>
                                <span class="stat-label mt-10">Trades</span>
                                <p class="stat-value" id="trades-completed">0</p>
                            </div>
                            <div class="col s4">
                                <span class="stat-label">Avg. Profit</span>
                                <p class="stat-value" id="avg-profit">$0.00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/dbConnect.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/grid-details.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/grid-details.js"></script>
</body>

</html>
