<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A3263">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bot Manager</title>
    <!-- materialize icons, css & js -->
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="/css/styles.css" rel="stylesheet">
    <link type="text/css" href="/css/loader.css" rel="stylesheet">
    <script type="text/javascript" src="/js/materialize.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#13263d">
</head>

<body class="grey lighten-4">
    <!-- Header -->
    <nav class="z-depth-0">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo left"><img src="/img/logo.png" alt="logo"></a>
            <span class="right grey-text text-darken-1">
                <i class="material-icons sidenav-trigger" style="cursor: pointer;" data-target="side-menu">menu</i>
            </span>
        </div>
    </nav>

    <!-- side nav -->
    <ul id="side-menu" class="sidenav side-menu"></ul>

    <div class="container">
        <div class="row" style="margin-top: 20px;">
            <div class="col s12">
                <div class="card orange lighten-5 card-soft border-orange">
                    <div class="card-content" style="padding: 15px 20px;">
                        <span class="card-title orange-text text-darken-4 fw-bold mb-20" style="font-size: 1rem; letter-spacing: 0.5px;">
                            MASTER CIRCUIT BREAKERS
                        </span>
                        
                        <div class="breaker-row mb-15">
                            <span class="grey-text text-darken-3 fw-600">Bot System</span>
                            <div class="switch">
                                <label>
                                    <span class="hide-on-small-only">Off</span>
                                    <input type="checkbox" checked>
                                    <span class="lever"></span>
                                    On
                                </label>
                            </div>
                        </div>

                        <div class="breaker-row mb-20">
                            <span class="grey-text text-darken-3 fw-600">Trading Activity</span>
                            <div class="switch">
                                <label>
                                    <span class="hide-on-small-only">Stop</span>
                                    <input type="checkbox" checked>
                                    <span class="lever"></span>
                                    Active
                                </label>
                            </div>
                        </div>

                        <button class="btn-large red darken-2 waves-effect waves-light btn-block" style="width: 100%; border-radius: 12px; font-weight: 800; height: 50px;">
                            <i class="material-icons left">gpp_maybe</i> EMERGENCY STOP
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <ul class="collapsible z-depth-0" style="border:none;">
            <li class="active">
                <div class="collapsible-header white card-soft mb-5 valign-wrapper">
                    <i class="material-icons blue-text">smart_toy</i>Bot Strategy Settings
                </div>
                <div class="collapsible-body white mb-10">
                    <div class="row mb-0">
                        <div class="input-field col s12">
                            <p class="stat-label">Auto Coin Selection</p>
                            <div class="switch"><label>Manual <input type="checkbox"> <span class="lever"></span> Auto</label></div>
                        </div>
                        <div class="input-field col s6">
                            <input id="max_coins" type="number" value="2" min="1" max="5">
                            <label for="max_coins">Max Active Coins</label>
                        </div>
                        <div class="input-field col s6">
                            <input id="total_cap" type="number" value="1000">
                            <label for="total_cap">Total Capital ($)</label>
                        </div>
                    </div>
                </div>
            </li>

            <li>
                <div class="collapsible-header white card-soft mb-5 valign-wrapper">
                    <i class="material-icons red-text">gpp_maybe</i>Risk Management
                </div>
                <div class="collapsible-body white mb-10">
                    <div class="row mb-0">
                        <div class="col s12">
                            <p class="stat-label">Max Drawdown (%)</p>
                            <p class="range-field"><input type="range" min="1" max="20" value="5" /></p>
                        </div>
                        <div class="input-field col s12">
                            <input id="daily_loss" type="number" value="50">
                            <label for="daily_loss">Daily Loss Limit ($)</label>
                        </div>
                    </div>
                </div>
            </li>

            <li>
                <div class="collapsible-header white card-soft mb-5 valign-wrapper">
                    <i class="material-icons grey-text">account_balance</i>Exchange & API
                </div>
                <div class="collapsible-body white mb-10">
                    <div class="row mb-0">
                        <div class="input-field col s12">
                            <p class="stat-label">Demo (Paper Trading)</p>
                            <div class="switch"><label>Live <input type="checkbox" checked> <span class="lever"></span> Demo</label></div>
                        </div>
                        <div class="input-field col s12">
                            <input id="api_key" type="password" value="****************">
                            <label for="api_key">API Key</label>
                        </div>
                        <button class="btn-flat blue-text waves-effect">Test Connection</button>
                    </div>
                </div>
            </li>
        </ul>

        <div class="fixed-action-btn">
            <button class="btn-floating btn-large green darken-2 waves-effect z-depth-3">
                <i class="large material-icons">save</i>
            </button>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <script type="text/javascript" src="/js/dbConnect.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/configurations.js"></script>
</body>

</html>
